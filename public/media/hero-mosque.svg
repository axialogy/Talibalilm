<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 626 417" role="img" aria-label="Mosquée">
  <title>Mosquée</title>
  <defs>
    <linearGradient id="dome" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fbfcfc"/>
      <stop offset="0.55" stop-color="#e6eaec"/>
      <stop offset="1" stop-color="#c9d1d5"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#f2f5f6"/>
      <stop offset="1" stop-color="#d7dee1"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fafbfb"/>
      <stop offset="0.6" stop-color="#e4e9eb"/>
      <stop offset="1" stop-color="#c5ced2"/>
    </linearGradient>
    <filter id="fog" x="-25%" y="-140%" width="150%" height="380%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <linearGradient id="fogfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Geometric rosette, top-left, the way the reference frames the scene -->
  <g fill="none" stroke="#b9c3c8" stroke-width="2" opacity="0.26">
    <polygon points="216.6,109.4 140.2,114.2 135.4,190.6 78.0,140.0 20.6,190.6 15.8,114.2 -60.6,109.4 -10.0,52.0 -60.6,-5.4 15.8,-10.2 20.6,-86.6 78.0,-36.0 135.4,-86.6 140.2,-10.2 216.6,-5.4 166.0,52.0" />
    <polygon points="174.1,91.8 121.1,95.1 117.8,148.1 78.0,113.0 38.2,148.1 34.9,95.1 -18.1,91.8 17.0,52.0 -18.1,12.2 34.9,8.9 38.2,-44.1 78.0,-9.0 117.8,-44.1 121.1,8.9 174.1,12.2 139.0,52.0" />
    <polygon points="131.6,74.2 102.0,76.0 100.2,105.6 78.0,86.0 55.8,105.6 54.0,76.0 24.4,74.2 44.0,52.0 24.4,29.8 54.0,28.0 55.8,-1.6 78.0,18.0 100.2,-1.6 102.0,28.0 131.6,29.8 112.0,52.0" />
    <polygon points="115.0,67.3 93.3,89.0 62.7,89.0 41.0,67.3 41.0,36.7 62.7,15.0 93.3,15.0 115.0,36.7" />
  </g>

  <g stroke="#c2ccd0" stroke-width="1.4">
    <!-- Prayer hall -->
    <path d="M318 396 V300 h244 v96 Z" fill="url(#wall)"/>
    <path d="M330 300 q0-26 26-26 h168 q26 0 26 26 Z" fill="url(#dome)"/>

    <!-- Main dome, drum and finial -->
    <path d="M348 274 h164 v26 h-164 Z" fill="url(#wall)"/>
    <path d="M348 274 C 348 196 384 156 430 136 C 476 156 512 196 512 274 Z" fill="url(#dome)"/>
    <path d="M430 136 v-22" stroke-width="3"/>
    <circle cx="430" cy="107" r="6" fill="#e9edef"/>
    <path d="M430 101 a11 11 0 1 0 8 18 a8.6 8.6 0 1 1 -8 -18 Z" fill="#dfe5e8"/>

    <!-- Side domes -->
    <path d="M292 300 C 292 262 306 246 324 238 C 342 246 356 262 356 300 Z" fill="url(#dome)" opacity="0.9"/>
    <path d="M524 300 C 524 266 536 250 552 243 C 568 250 580 266 580 300 Z" fill="url(#dome)" opacity="0.85"/>

    <!-- Arched windows -->
    <g fill="#b9c4c9" stroke="none" opacity="0.65">
      <path d="M352 396 v-52 q0-16 15-16 q15 0 15 16 v52 Z"/>
      <path d="M414 396 v-52 q0-16 15-16 q15 0 15 16 v52 Z"/>
      <path d="M476 396 v-52 q0-16 15-16 q15 0 15 16 v52 Z"/>
    </g>

    <!-- Minaret -->
    <path d="M228 396 h48 l-5-104 h-38 Z" fill="url(#tower)"/>
    <rect x="220" y="278" width="64" height="14" rx="3" fill="url(#dome)"/>
    <path d="M234 278 h36 l-4-72 h-28 Z" fill="url(#tower)"/>
    <rect x="226" y="192" width="52" height="13" rx="3" fill="url(#dome)"/>
    <path d="M238 192 h28 l-3-62 h-22 Z" fill="url(#tower)"/>
    <rect x="231" y="118" width="42" height="12" rx="3" fill="url(#dome)"/>
    <path d="M243 118 C 243 96 246 84 252 76 C 258 84 261 96 261 118 Z" fill="url(#dome)"/>
    <path d="M252 76 v-16" stroke-width="2.5"/>
    <path d="M252 55 a8 8 0 1 0 6 13 a6.3 6.3 0 1 1 -6 -13 Z" fill="#dfe5e8"/>

    <!-- Minaret window slits -->
    <g fill="#b9c4c9" stroke="none" opacity="0.6">
      <rect x="246" y="222" width="9" height="30" rx="4.5"/>
      <rect x="244" y="312" width="12" height="38" rx="6"/>
    </g>
  </g>

  <!-- Low fog the scene sits in -->
  <g fill="#ffffff" filter="url(#fog)" opacity="0.5">
    <ellipse cx="300" cy="408" rx="210" ry="16"/>
    <ellipse cx="540" cy="392" rx="120" ry="13"/>
    <ellipse cx="120" cy="414" rx="150" ry="14"/>
  </g>
  <rect x="0" y="318" width="626" height="99" fill="url(#fogfade)"/>
</svg>
